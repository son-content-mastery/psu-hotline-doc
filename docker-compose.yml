services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotline_doc}
      POSTGRES_USER: ${POSTGRES_USER:-hotline_doc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotline_doc}
      POSTGRES_USER: ${POSTGRES_USER:-hotline_doc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only-change-me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-true}
      RUN_MIGRATIONS: "true"
      PASSWORD_RESET_THROTTLE_RATE: ${PASSWORD_RESET_THROTTLE_RATE:-5/hour}
      REGISTRATION_THROTTLE_RATE: ${REGISTRATION_THROTTLE_RATE:-5/hour}
      ACTIVATION_THROTTLE_RATE: ${ACTIVATION_THROTTLE_RATE:-5/hour}
      ACCOUNT_EMAIL_THROTTLE_RATE: ${ACCOUNT_EMAIL_THROTTLE_RATE:-5/hour}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-10}
      EMAIL_SUPPRESSED_DOMAINS: ${EMAIL_SUPPRESSED_DOMAINS:-example.test,example.com,example.org}
      ACCOUNT_ACTIVATION_TOKEN_MAX_AGE_SECONDS: ${ACCOUNT_ACTIVATION_TOKEN_MAX_AGE_SECONDS:-86400}
      EMAIL_OUTBOX_MAX_ATTEMPTS: ${EMAIL_OUTBOX_MAX_ATTEMPTS:-5}
      EMAIL_OUTBOX_RETRY_BASE_SECONDS: ${EMAIL_OUTBOX_RETRY_BASE_SECONDS:-60}
      EMAIL_OUTBOX_POLL_SECONDS: ${EMAIL_OUTBOX_POLL_SECONDS:-30}
      WORKFLOW_NOTIFICATION_EMAIL_ENABLED: ${WORKFLOW_NOTIFICATION_EMAIL_ENABLED:-true}
      DOCUMENT_QUALITY_PREFLIGHT_ENABLED: ${DOCUMENT_QUALITY_PREFLIGHT_ENABLED:-true}
      DOCUMENT_TYPE_OCR_ENABLED: ${DOCUMENT_TYPE_OCR_ENABLED:-true}
      DOCUMENT_TYPE_OCR_TIMEOUT_SECONDS: ${DOCUMENT_TYPE_OCR_TIMEOUT_SECONDS:-10}
      LICENSE_RENEWAL_REMINDERS_ENABLED: ${LICENSE_RENEWAL_REMINDERS_ENABLED:-true}
      LICENSE_RENEWAL_REMINDER_DAYS: ${LICENSE_RENEWAL_REMINDER_DAYS:-90,30,7}
      LICENSE_RENEWAL_SCAN_SECONDS: ${LICENSE_RENEWAL_SCAN_SECONDS:-3600}
      EXPECTED_LOCAL_AUTHORITY_COUNT: ${EXPECTED_LOCAL_AUTHORITY_COUNT:-19}
      CENTRAL_OVERDUE_THRESHOLD_DAYS: ${CENTRAL_OVERDUE_THRESHOLD_DAYS:-7}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-HoTLinE Doc <noreply@example.test>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  email-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RUN_DEMO_SEED: "false"
      RUN_MIGRATIONS: "false"
    command: ["python", "manage.py", "run_email_outbox_worker"]
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
